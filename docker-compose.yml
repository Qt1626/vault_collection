services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pinvault
      POSTGRES_USER: pinvault
      POSTGRES_PASSWORD: pinvault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinvault"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    profiles: ["full"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/pinvault
      DB_USER: pinvault
      DB_PASSWORD: pinvault
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-0123456789abcdef}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    profiles: ["full"]
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
