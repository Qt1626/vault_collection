# PinVault — toute l'application dans Docker.
#
#   cp .env.example .env          (une seule fois, puis personnaliser les secrets)
#   docker compose up --build     → http://localhost:3000
#
# Pour développer avec rechargement à chaud, ne lancer que la base :
#   docker compose up -d db       puis backend (mvn spring-boot:run) et frontend (npm run dev) en local

name: pinvault

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pinvault}
      POSTGRES_USER: ${DB_USER:-pinvault}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pinvault}
    ports:
      # exposé uniquement sur la machine locale (IntelliJ, DBeaver, mvn spring-boot:run…)
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: pinvault-api:local
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-pinvault}
      DB_USER: ${DB_USER:-pinvault}
      DB_PASSWORD: ${DB_PASSWORD:-pinvault}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-0123456789}
      CORS_ORIGINS: http://localhost:3000
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      # accès direct à l'API et à Swagger UI : http://localhost:8080/swagger-ui.html
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

  frontend:
    build: ./frontend
    image: pinvault-web:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata:     # données PostgreSQL
  uploads:    # photos de pin's envoyées par les membres
