# Utilisé uniquement par VS Code « Reopen in Container » : un conteneur de dev + la base PostgreSQL.
name: pinvault-dev

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/disney-pins:cached
      - m2:/root/.m2                                   # cache Maven conservé entre deux sessions
      - /var/run/docker.sock:/var/run/docker.sock      # Testcontainers + docker compose depuis le conteneur
    environment:
      DB_URL: jdbc:postgresql://db:5432/pinvault
      DB_USER: pinvault
      DB_PASSWORD: pinvault
      UPLOAD_DIR: /workspaces/disney-pins/backend/uploads
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pinvault
      POSTGRES_USER: pinvault
      POSTGRES_PASSWORD: pinvault
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinvault"]
      interval: 5s
      retries: 10

volumes:
  m2:
  pgdata-dev:
