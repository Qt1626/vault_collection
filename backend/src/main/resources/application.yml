spring:
  application:
    name: pinvault-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pinvault}
    username: ${DB_USER:pinvault}
    password: ${DB_PASSWORD:pinvault}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}

app:
  jwt:
    # À surcharger en production via la variable d'environnement JWT_SECRET (>= 32 caractères)
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
    validity: PT24H
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  tcgdex:
    # API publique des cartes Pokémon (https://tcgdex.dev), gratuite et sans clé
    base-url: ${TCGDEX_URL:https://api.tcgdex.net/v2}
    language: fr
  upload:
    # Dossier des photos de pin's (en Docker : volume monté sur /data/uploads)
    dir: ${UPLOAD_DIR:./uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
